<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY HOPPER — 深空穿越</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ==================== 基础重置 ==================== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #05060d;
    --bg-mid: #0a0f1f;
    --accent: #00f0ff;
    --accent-warm: #ff4d6d;
    --accent-purple: #b388ff;
    --text: #e8f1ff;
    --text-dim: #7a8ba8;
    --glow: 0 0 20px rgba(0, 240, 255, 0.6), 0 0 40px rgba(0, 240, 255, 0.3);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
  }

  /* ==================== 舞台容器 ==================== */
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(179, 136, 255, 0.15), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(0, 240, 255, 0.1), transparent 50%),
      var(--bg-deep);
  }

  /* 顶部噪点/扫描线 — 营造 CRT 质感 */
  #stage::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.15) 3px,
      rgba(0, 0, 0, 0) 4px
    );
    z-index: 100;
    mix-blend-mode: multiply;
  }

  /* ==================== 画布 ==================== */
  #game {
    display: block;
    border: 1px solid rgba(0, 240, 255, 0.2);
    box-shadow:
      0 0 60px rgba(0, 240, 255, 0.15),
      inset 0 0 80px rgba(0, 0, 0, 0.5);
    background: linear-gradient(180deg, #02030a 0%, #0a0f1f 50%, #0d1029 100%);
    image-rendering: pixelated;
  }

  /* ==================== HUD (右上角分数) ==================== */
  #hud {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 48px;
    z-index: 10;
    pointer-events: none;
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .hud-label {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .hud-value {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: var(--glow);
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
  }

  .hud-value.best { color: var(--accent-purple); text-shadow: 0 0 20px rgba(179, 136, 255, 0.6); }

  /* ==================== 覆盖层 (开始/结束) ==================== */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(5, 6, 13, 0.7) 0%, rgba(5, 6, 13, 0.95) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 20;
    transition: opacity 0.4s ease;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .title {
    font-family: 'Chakra Petch', sans-serif;
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--text);
    text-shadow:
      0 0 20px var(--accent),
      0 0 40px var(--accent),
      2px 2px 0 var(--accent-warm);
    margin-bottom: 8px;
    position: relative;
  }

  .title::before {
    content: 'SKY HOPPER';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    color: var(--accent-warm);
    opacity: 0.8;
    transform: translate(-3px, 0);
    mix-blend-mode: screen;
    animation: glitch 3s infinite;
  }

  @keyframes glitch {
    0%, 90%, 100% { transform: translate(-3px, 0); opacity: 0.8; }
    92% { transform: translate(3px, 2px); opacity: 1; }
    94% { transform: translate(-5px, -1px); opacity: 0.6; }
    96% { transform: translate(2px, 1px); opacity: 0.9; }
  }

  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.4em;
    color: var(--text-dim);
    margin-bottom: 48px;
    text-transform: uppercase;
  }

  .prompt {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 18px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    padding: 16px 32px;
    border: 1px solid var(--accent);
    box-shadow:
      0 0 30px rgba(0, 240, 255, 0.4),
      inset 0 0 20px rgba(0, 240, 255, 0.1);
    animation: pulse 1.5s ease-in-out infinite;
    background: rgba(0, 240, 255, 0.05);
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.1); }
    50% { transform: scale(1.02); box-shadow: 0 0 50px rgba(0, 240, 255, 0.7), inset 0 0 30px rgba(0, 240, 255, 0.2); }
  }

  .game-over-score {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 72px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: var(--glow);
    margin: 16px 0;
    font-variant-numeric: tabular-nums;
  }

  .game-over-best {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    margin-bottom: 32px;
  }

  .game-over-best .val {
    color: var(--accent-purple);
    font-weight: 500;
  }

  .new-record {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 14px;
    color: var(--accent-warm);
    letter-spacing: 0.4em;
    margin-bottom: 16px;
    text-transform: uppercase;
    animation: flash 0.6s ease-in-out infinite alternate;
  }

  @keyframes flash {
    from { opacity: 0.5; }
    to { opacity: 1; text-shadow: 0 0 20px var(--accent-warm); }
  }

  /* ==================== 左下角控制提示 ==================== */
  #controls {
    position: absolute;
    bottom: 20px;
    left: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    z-index: 10;
    line-height: 1.8;
  }

  #controls .key {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid var(--text-dim);
    border-radius: 3px;
    margin: 0 4px;
    color: var(--text);
    font-size: 10px;
  }

  /* ==================== 右下角署名 ==================== */
  #sig {
    position: absolute;
    bottom: 20px;
    right: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    z-index: 10;
  }

  #sig .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    box-shadow: 0 0 8px var(--accent);
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ==================== LEVEL UP 横幅 ==================== */
  .level-banner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 15;
    pointer-events: none;
    animation: levelPop 1.6s ease-out forwards;
  }

  .level-banner.hidden {
    display: none;
  }

  .level-banner-top {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 18px;
    letter-spacing: 0.5em;
    color: var(--accent-warm);
    text-shadow: 0 0 20px var(--accent-warm);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .level-banner-name {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 72px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--text);
    text-shadow:
      0 0 30px var(--accent-warm),
      0 0 60px var(--accent-warm),
      3px 3px 0 var(--accent);
    text-transform: uppercase;
  }

  @keyframes levelPop {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.3);
      filter: blur(20px);
    }
    15% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.15);
      filter: blur(0);
    }
    25% {
      transform: translate(-50%, -50%) scale(1);
    }
    75% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.3);
      filter: blur(8px);
    }
  }

</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="720"></canvas>

  <!-- 分数 HUD -->
  <div id="hud">
    <div class="hud-item">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="scoreDisplay">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">Best</div>
      <div class="hud-value best" id="bestDisplay">0</div>
    </div>
  </div>

  <!-- 左下角操作提示 -->
  <div id="controls">
    <div><span class="key">SPACE</span> / <span class="key">↑</span> 推进</div>
    <div><span class="key">R</span> 重来 &nbsp;&nbsp; <span class="key">M</span> 静音</div>
  </div>

  <div id="sig"><span class="dot"></span>SKY HOPPER · v1.0</div>

  <!-- 开始界面 -->
  <div class="overlay" id="startScreen">
    <h1 class="title">SKY HOPPER</h1>
    <div class="subtitle">Deep Space Transit</div>
    <div class="prompt">PRESS SPACE TO LAUNCH</div>
  </div>

  <!-- 结束界面 -->
  <div class="overlay hidden" id="gameOverScreen">
    <div class="new-record hidden" id="newRecord">★ NEW RECORD ★</div>
    <div class="subtitle">Mission Terminated</div>
    <div class="game-over-score" id="finalScore">0</div>
    <div class="game-over-best">Best · <span class="val" id="finalBest">0</span></div>
    <div class="prompt">PRESS SPACE TO RETRY</div>
  </div>

  <!-- 升级横幅 -->
  <div id="levelUpBanner" class="level-banner hidden">
    <div class="level-banner-top">LEVEL UP</div>
    <div class="level-banner-name" id="levelBannerName">ACCELERATE</div>
  </div>
</div>

<script>
/* ==================================================================
   SKY HOPPER — 深空穿越
   用 Canvas 2D 写的 Flappy Bird 变体,太空主题
   整个游戏就这一个文件,方便改、方便发布
   ================================================================== */

(() => {
  'use strict';

  // ===== 画布和配置 =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // 游戏常量 —— 调整这些数字可以改游戏手感
  const GRAVITY = 0.45;           // 重力 (越大掉得越快)
  const THRUST = -7.8;            // 推进速度 (负值=向上)
  const MAX_FALL = 11;            // 最大下落速度
  const PIPE_GAP = 180;           // 小行星之间的缝隙
  const PIPE_INTERVAL = 1500;     // 新障碍生成间隔 (毫秒)
  const BASE_PIPE_SPEED = 2.8;    // 障碍物初始移动速度
  const BASE_ASTEROID_SIZE = 50;  // 小行星初始半径
  const SHIP_X = 120;             // 飞船固定 X 坐标

  // ===== 难度曲线 =====
  // 每 10 分加一档,最多 10 档(100 分封顶)
  // 在 30/60/90 分时触发全屏 LEVEL UP 动画
  const LEVEL_NAMES = ['CRUISE', 'ACCELERATE', 'DANGER', 'CHAOS', 'VOID'];
  function getDifficulty() {
    const tier = Math.min(Math.floor(score / 10), 10);
    return {
      tier: tier,
      speedMult: 1 + tier * 0.08,   // 最多 +80% 速度
      sizeBonus: tier * 1.6,         // 半径最多 +16 像素
    };
  }

  // ===== 游戏状态 =====
  const STATE = { READY: 0, PLAYING: 1, OVER: 2 };
  let state = STATE.READY;

  // ===== 飞船 =====
  const ship = {
    x: SHIP_X, y: H / 2,
    vy: 0,
    rotation: 0,
    radius: 14,
    thrustTimer: 0,   // 推进动画计时
  };

  // ===== 世界对象 =====
  let obstacles = [];          // 小行星对
  let particles = [];          // 粒子效果
  let stars = [];              // 背景星
  let score = 0;
  let best = +(localStorage.getItem('skyhopper_best') || 0);
  let lastPipeTime = 0;
  let shakeAmount = 0;         // 屏幕抖动强度
  let flashAmount = 0;         // 屏幕闪烁
  let isMuted = false;
  let startTime = 0;
  let lastLevelShown = 0;      // 已经展示过 LEVEL UP 的分数档位

  // ===== HUD 元素 =====
  const scoreDisplay = document.getElementById('scoreDisplay');
  const bestDisplay = document.getElementById('bestDisplay');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const newRecord = document.getElementById('newRecord');
  const levelUpBanner = document.getElementById('levelUpBanner');
  const levelBannerName = document.getElementById('levelBannerName');
  bestDisplay.textContent = best;

  // ==================================================================
  // 音效 —— 用 Web Audio 程序生成,不需要下载任何文件
  // ==================================================================
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playTone(freq, duration, type = 'sine', volume = 0.15) {
    if (isMuted) return;
    try {
      const ac = getAudio();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ac.currentTime);
      gain.gain.setValueAtTime(volume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + duration);
    } catch(e) {}
  }

  function soundThrust() { playTone(520, 0.08, 'square', 0.08); }
  function soundScore()  { playTone(880, 0.1, 'triangle', 0.12); setTimeout(() => playTone(1320, 0.1, 'triangle', 0.1), 50); }
  function soundCrash()  {
    if (isMuted) return;
    try {
      const ac = getAudio();
      // 白噪声爆炸
      const bufferSize = ac.sampleRate * 0.4;
      const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
      }
      const src = ac.createBufferSource();
      src.buffer = buffer;
      const gain = ac.createGain();
      gain.gain.setValueAtTime(0.3, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
      src.connect(gain);
      gain.connect(ac.destination);
      src.start();
    } catch(e) {}
  }

  // ==================================================================
  // 初始化星空背景 —— 三层视差
  // ==================================================================
  function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: Math.random() * 3,        // 0=远 1=中 2=近
        size: Math.random() * 1.5 + 0.3,
        twinkle: Math.random() * Math.PI * 2,
      });
    }
  }

  // ==================================================================
  // 重置游戏
  // ==================================================================
  function reset() {
    ship.x = SHIP_X;
    ship.y = H / 2;
    ship.vy = 0;
    ship.rotation = 0;
    ship.thrustTimer = 0;
    obstacles = [];
    particles = [];
    score = 0;
    lastPipeTime = performance.now();
    shakeAmount = 0;
    flashAmount = 0;
    lastLevelShown = 0;
    levelUpBanner.classList.add('hidden');
    scoreDisplay.textContent = '0';
  }

  // ==================================================================
  // 游戏主循环 —— 物理 & 碰撞
  // ==================================================================
  function update(dt, now) {
    // 星空永远滚动,不论游戏状态
    stars.forEach(s => {
      s.x -= (s.z * 0.3 + 0.1) * (state === STATE.PLAYING ? 1 : 0.3);
      if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
      s.twinkle += 0.05;
    });

    // 非游戏状态:飞船轻微浮动
    if (state !== STATE.PLAYING) {
      ship.y = H / 2 + Math.sin(now * 0.002) * 8;
      ship.rotation = Math.sin(now * 0.002) * 0.1;
      // 闲置也发出引擎粒子
      if (Math.random() < 0.3) spawnEngineParticle();
      updateParticles();
      return;
    }

    // ===== 飞船物理 =====
    ship.vy += GRAVITY;
    if (ship.vy > MAX_FALL) ship.vy = MAX_FALL;
    ship.y += ship.vy;

    // 倾斜 —— 看起来更有动感
    ship.rotation = Math.max(-0.4, Math.min(0.9, ship.vy * 0.05));

    // ===== 生成新的小行星对 =====
    if (now - lastPipeTime > PIPE_INTERVAL) {
      lastPipeTime = now;
      const minY = 90;
      const maxY = H - 90 - PIPE_GAP;
      const gapY = Math.random() * (maxY - minY) + minY;
      const diff = getDifficulty();
      obstacles.push({
        x: W + 40,
        gapY: gapY,
        gapH: PIPE_GAP,
        size: BASE_ASTEROID_SIZE + diff.sizeBonus,  // 小行星随难度变大
        passed: false,
        rotTop: Math.random() * Math.PI * 2,
        rotBot: Math.random() * Math.PI * 2,
        rotSpeedTop: (Math.random() - 0.5) * 0.02,
        rotSpeedBot: (Math.random() - 0.5) * 0.02,
      });
    }

    // ===== 小行星移动 + 计分 =====
    const currentSpeed = BASE_PIPE_SPEED * getDifficulty().speedMult;
    obstacles.forEach(o => {
      o.x -= currentSpeed;
      o.rotTop += o.rotSpeedTop;
      o.rotBot += o.rotSpeedBot;
      if (!o.passed && o.x + 40 < ship.x) {
        o.passed = true;
        score++;
        scoreDisplay.textContent = score;
        soundScore();
        // 得分闪光
        flashAmount = 0.3;
        // 得分粒子
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: ship.x, y: ship.y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 30, maxLife: 30,
            color: '#00f0ff', size: 2,
            type: 'spark',
          });
        }
        // 检查是否到达升级里程碑 (每 30 分)
        checkLevelUp();
      }
    });
    obstacles = obstacles.filter(o => o.x > -80);

    // ===== 引擎尾迹粒子 =====
    if (Math.random() < 0.6) spawnEngineParticle();

    // ===== 碰撞检测 =====
    // 上下边界
    if (ship.y - ship.radius < 0 || ship.y + ship.radius > H) {
      gameOver();
      return;
    }

    // 小行星
    for (const o of obstacles) {
      if (ship.x + ship.radius > o.x && ship.x - ship.radius < o.x + 60) {
        if (ship.y - ship.radius < o.gapY || ship.y + ship.radius > o.gapY + o.gapH) {
          gameOver();
          return;
        }
      }
    }

    updateParticles();

    // 衰减抖动和闪光
    shakeAmount *= 0.88;
    flashAmount *= 0.92;
  }

  function spawnEngineParticle() {
    // 从飞船尾部喷出
    const trailX = ship.x - 14 - Math.cos(ship.rotation) * 6;
    const trailY = ship.y + Math.sin(ship.rotation) * 6;
    particles.push({
      x: trailX + (Math.random() - 0.5) * 4,
      y: trailY + (Math.random() - 0.5) * 4,
      vx: -2 - Math.random() * 1.5,
      vy: (Math.random() - 0.5) * 0.8,
      life: 20 + Math.random() * 15,
      maxLife: 35,
      color: Math.random() < 0.5 ? '#00f0ff' : '#b388ff',
      size: 2 + Math.random() * 2,
      type: 'trail',
    });
  }

  function updateParticles() {
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.type === 'spark') {
        p.vy += 0.15;
        p.vx *= 0.97;
      }
      p.life--;
    });
    particles = particles.filter(p => p.life > 0);
  }

  // ===== 升级检测 =====
  // 每 30 分触发一次 LEVEL UP 动画
  function checkLevelUp() {
    const milestone = Math.floor(score / 30);
    if (milestone > lastLevelShown && milestone > 0) {
      lastLevelShown = milestone;
      // 从 LEVEL_NAMES 里取名字 (0 档叫 CRUISE,所以 30 分触发 ACCELERATE)
      const name = LEVEL_NAMES[Math.min(milestone, LEVEL_NAMES.length - 1)];
      showLevelUp(name);
    }
  }

  function showLevelUp(name) {
    levelBannerName.textContent = name;
    // 重启动画:先移除,强制重绘,再加回来
    levelUpBanner.classList.add('hidden');
    // 触发重绘
    void levelUpBanner.offsetWidth;
    levelUpBanner.classList.remove('hidden');
    // 1.6 秒后自动隐藏 (匹配 CSS 动画时长)
    setTimeout(() => {
      levelUpBanner.classList.add('hidden');
    }, 1600);
    // 升级音效
    if (!isMuted) {
      playTone(440, 0.15, 'triangle', 0.15);
      setTimeout(() => playTone(660, 0.15, 'triangle', 0.15), 80);
      setTimeout(() => playTone(880, 0.25, 'triangle', 0.15), 160);
    }
    // 屏幕闪光
    flashAmount = 0.6;
  }

  function thrust() {
    if (state === STATE.READY) {
      state = STATE.PLAYING;
      startTime = performance.now();
      lastPipeTime = startTime;
      startScreen.classList.add('hidden');
    } else if (state === STATE.OVER) {
      // 结束后按空格重开 —— 但必须等结束画面显示出来,避免误触
      if (gameOverScreen.classList.contains('hidden')) return;
      reset();
      state = STATE.PLAYING;
      startTime = performance.now();
      lastPipeTime = startTime;
      gameOverScreen.classList.add('hidden');
      return;
    }
    if (state === STATE.PLAYING) {
      ship.vy = THRUST;
      ship.thrustTimer = 10;
      soundThrust();
      // 推进时喷出爆发粒子
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: ship.x - 12, y: ship.y,
          vx: -3 - Math.random() * 2,
          vy: (Math.random() - 0.5) * 3,
          life: 18, maxLife: 18,
          color: '#00f0ff', size: 3,
          type: 'trail',
        });
      }
    }
  }

  function gameOver() {
    state = STATE.OVER;
    shakeAmount = 20;
    flashAmount = 1;
    soundCrash();

    // 飞船爆炸 —— 一堆粒子
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      particles.push({
        x: ship.x, y: ship.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 40 + Math.random() * 20,
        maxLife: 60,
        color: ['#ff4d6d', '#ffb700', '#00f0ff'][Math.floor(Math.random() * 3)],
        size: 2 + Math.random() * 3,
        type: 'spark',
      });
    }

    // 记录分数
    const isNew = score > best;
    if (isNew) {
      best = score;
      localStorage.setItem('skyhopper_best', best);
      bestDisplay.textContent = best;
    }

    // 延迟显示结束界面 (先让爆炸演一会)
    setTimeout(() => {
      finalScore.textContent = score;
      finalBest.textContent = best;
      newRecord.classList.toggle('hidden', !isNew);
      gameOverScreen.classList.remove('hidden');
    }, 700);
  }

  // ==================================================================
  // 渲染 —— 画画的部分
  // ==================================================================
  function render() {
    ctx.save();

    // 屏幕抖动
    if (shakeAmount > 0.5) {
      ctx.translate(
        (Math.random() - 0.5) * shakeAmount,
        (Math.random() - 0.5) * shakeAmount
      );
    }

    // ===== 背景渐变 =====
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#02030a');
    bg.addColorStop(0.5, '#0a0f1f');
    bg.addColorStop(1, '#0d1029');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ===== 星空 (三层视差) =====
    stars.forEach(s => {
      const tw = Math.sin(s.twinkle) * 0.3 + 0.7;
      const alpha = (s.z / 3) * 0.8 + 0.2;
      ctx.fillStyle = `rgba(${s.z > 1.5 ? '255, 230, 200' : s.z > 0.7 ? '200, 220, 255' : '150, 170, 210'}, ${alpha * tw})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * (0.5 + s.z / 4), 0, Math.PI * 2);
      ctx.fill();
      // 近的星加光晕
      if (s.z > 2) {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.15 * tw})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // ===== 远方星云效果 =====
    const nebula = ctx.createRadialGradient(W * 0.7, H * 0.3, 20, W * 0.7, H * 0.3, 200);
    nebula.addColorStop(0, 'rgba(179, 136, 255, 0.15)');
    nebula.addColorStop(1, 'rgba(179, 136, 255, 0)');
    ctx.fillStyle = nebula;
    ctx.fillRect(0, 0, W, H);

    // ===== 小行星障碍 =====
    obstacles.forEach(o => drawAsteroidPair(o));

    // ===== 粒子 (尾迹在飞船之前) =====
    particles.filter(p => p.type === 'trail').forEach(p => drawParticle(p));

    // ===== 飞船 =====
    if (state !== STATE.OVER) drawShip();

    // ===== 爆炸粒子 (在飞船之上) =====
    particles.filter(p => p.type === 'spark').forEach(p => drawParticle(p));

    // ===== 闪光覆盖 =====
    if (flashAmount > 0.01) {
      ctx.fillStyle = `rgba(0, 240, 255, ${flashAmount * 0.3})`;
      ctx.fillRect(0, 0, W, H);
    }

    // ===== 暗角 (vignette) =====
    const vignette = ctx.createRadialGradient(W/2, H/2, H/2.5, W/2, H/2, H);
    vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vignette.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();
  }

  function drawShip() {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.rotation);

    // 外发光
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 20;

    // 引擎火焰 (推进时更大)
    const flameLen = ship.thrustTimer > 0 ? 18 : 10;
    if (ship.thrustTimer > 0) ship.thrustTimer--;
    const grad = ctx.createLinearGradient(-flameLen, 0, -4, 0);
    grad.addColorStop(0, 'rgba(0, 240, 255, 0)');
    grad.addColorStop(0.5, 'rgba(0, 240, 255, 0.6)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 1)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-flameLen, 0);
    ctx.lineTo(-4, -5);
    ctx.lineTo(-4, 5);
    ctx.closePath();
    ctx.fill();

    // 飞船机身 (三角形 + 细节)
    ctx.shadowBlur = 15;
    // 主体
    ctx.fillStyle = '#e8f1ff';
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(16, 0);            // 机头
    ctx.lineTo(-8, -10);          // 左后
    ctx.lineTo(-4, 0);            // 中后
    ctx.lineTo(-8, 10);           // 右后
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 驾驶舱 (青色小圆)
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(6, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // 机翼线条
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-2, -8);
    ctx.lineTo(10, 0);
    ctx.lineTo(-2, 8);
    ctx.stroke();

    ctx.restore();
  }

  function drawAsteroidPair(o) {
    const size = o.size || BASE_ASTEROID_SIZE;
    // 上面的小行星
    drawAsteroid(o.x + 30, o.gapY - 30, size, o.rotTop);
    // 下面的小行星
    drawAsteroid(o.x + 30, o.gapY + o.gapH + 30, size, o.rotBot);

    // 可选:在缝隙中间画一条若隐若现的能量线条(视觉引导)
    // 小巧提示玩家路线
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(o.x + 30, o.gapY + 10);
    ctx.lineTo(o.x + 30, o.gapY + o.gapH - 10);
    ctx.stroke();
    ctx.restore();
  }

  function drawAsteroid(x, y, size, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);

    // 外发光
    ctx.shadowColor = '#ff4d6d';
    ctx.shadowBlur = 15;

    // 小行星形状 —— 不规则多边形
    const sides = 9;
    const points = [];
    for (let i = 0; i < sides; i++) {
      const angle = (i / sides) * Math.PI * 2;
      // 用确定性噪声让每个小行星外形稳定但不一样
      const r = size + Math.sin(i * 2.3 + rotation * 5) * 6 + Math.cos(i * 3.7) * 4;
      points.push([Math.cos(angle) * r, Math.sin(angle) * r]);
    }

    // 填充渐变
    const grad = ctx.createRadialGradient(-size * 0.3, -size * 0.3, size * 0.2, 0, 0, size);
    grad.addColorStop(0, '#6b4556');
    grad.addColorStop(0.6, '#3d2838');
    grad.addColorStop(1, '#1a0f1c');
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i][0], points[i][1]);
    }
    ctx.closePath();
    ctx.fill();

    // 边缘
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255, 77, 109, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 表面陨石坑
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.arc(-size * 0.2, -size * 0.1, size * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(size * 0.3, size * 0.2, size * 0.08, 0, Math.PI * 2);
    ctx.fill();

    // 高光
    ctx.fillStyle = 'rgba(255, 200, 200, 0.15)';
    ctx.beginPath();
    ctx.arc(-size * 0.35, -size * 0.35, size * 0.15, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawParticle(p) {
    const alpha = p.life / p.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ==================================================================
  // 主循环
  // ==================================================================
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(now - lastTime, 33);
    lastTime = now;
    update(dt, now);
    render();
    requestAnimationFrame(loop);
  }

  // ==================================================================
  // 输入
  // ==================================================================
  function handleInput(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      thrust();
    } else if (e.code === 'KeyR') {
      if (state === STATE.OVER || state === STATE.PLAYING) {
        reset();
        state = STATE.READY;
        gameOverScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
      }
    } else if (e.code === 'KeyM') {
      isMuted = !isMuted;
    }
  }

  document.addEventListener('keydown', handleInput);
  canvas.addEventListener('mousedown', (e) => { e.preventDefault(); thrust(); });
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); thrust(); }, { passive: false });

  // ==================================================================
  // 启动
  // ==================================================================
  initStars();
  reset();
  state = STATE.READY;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
