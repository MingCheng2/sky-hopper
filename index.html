<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY HOPPER — 深空穿越</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ==================== 基础重置 ==================== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #05060d;
    --bg-mid: #0a0f1f;
    --accent: #00f0ff;
    --accent-warm: #ff4d6d;
    --accent-purple: #b388ff;
    --text: #e8f1ff;
    --text-dim: #7a8ba8;
    --glow: 0 0 20px rgba(0, 240, 255, 0.6), 0 0 40px rgba(0, 240, 255, 0.3);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
  }

  /* ==================== 舞台容器 ==================== */
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(179, 136, 255, 0.15), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(0, 240, 255, 0.1), transparent 50%),
      var(--bg-deep);
  }

  /* 顶部噪点/扫描线 — 营造 CRT 质感 */
  #stage::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.15) 3px,
      rgba(0, 0, 0, 0) 4px
    );
    z-index: 100;
    mix-blend-mode: multiply;
  }

  /* ==================== 画布 ==================== */
  #game {
    display: block;
    border: 1px solid rgba(0, 240, 255, 0.2);
    box-shadow:
      0 0 60px rgba(0, 240, 255, 0.15),
      inset 0 0 80px rgba(0, 0, 0, 0.5);
    background: linear-gradient(180deg, #02030a 0%, #0a0f1f 50%, #0d1029 100%);
    image-rendering: pixelated;
  }

  /* ==================== HUD (右上角分数) ==================== */
  #hud {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 48px;
    z-index: 10;
    pointer-events: none;
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .hud-label {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .hud-value {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: var(--glow);
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
  }

  .hud-value.best { color: var(--accent-purple); text-shadow: 0 0 20px rgba(179, 136, 255, 0.6); }

  /* ==================== 覆盖层 (开始/结束) ==================== */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(5, 6, 13, 0.7) 0%, rgba(5, 6, 13, 0.95) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 20;
    transition: opacity 0.4s ease;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .title {
    font-family: 'Chakra Petch', sans-serif;
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--text);
    text-shadow:
      0 0 20px var(--accent),
      0 0 40px var(--accent),
      2px 2px 0 var(--accent-warm);
    margin-bottom: 8px;
    position: relative;
  }

  .title::before {
    content: 'SKY HOPPER';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    color: var(--accent-warm);
    opacity: 0.8;
    transform: translate(-3px, 0);
    mix-blend-mode: screen;
    animation: glitch 3s infinite;
  }

  @keyframes glitch {
    0%, 90%, 100% { transform: translate(-3px, 0); opacity: 0.8; }
    92% { transform: translate(3px, 2px); opacity: 1; }
    94% { transform: translate(-5px, -1px); opacity: 0.6; }
    96% { transform: translate(2px, 1px); opacity: 0.9; }
  }

  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.4em;
    color: var(--text-dim);
    margin-bottom: 48px;
    text-transform: uppercase;
  }

  .prompt {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 18px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    padding: 16px 32px;
    border: 1px solid var(--accent);
    box-shadow:
      0 0 30px rgba(0, 240, 255, 0.4),
      inset 0 0 20px rgba(0, 240, 255, 0.1);
    animation: pulse 1.5s ease-in-out infinite;
    background: rgba(0, 240, 255, 0.05);
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.1); }
    50% { transform: scale(1.02); box-shadow: 0 0 50px rgba(0, 240, 255, 0.7), inset 0 0 30px rgba(0, 240, 255, 0.2); }
  }

  .game-over-score {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 72px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: var(--glow);
    margin: 16px 0;
    font-variant-numeric: tabular-nums;
  }

  .game-over-best {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    margin-bottom: 32px;
  }

  .game-over-best .val {
    color: var(--accent-purple);
    font-weight: 500;
  }

  .new-record {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 14px;
    color: var(--accent-warm);
    letter-spacing: 0.4em;
    margin-bottom: 16px;
    text-transform: uppercase;
    animation: flash 0.6s ease-in-out infinite alternate;
  }

  @keyframes flash {
    from { opacity: 0.5; }
    to { opacity: 1; text-shadow: 0 0 20px var(--accent-warm); }
  }

  /* ==================== 左下角控制提示 ==================== */
  #controls {
    position: absolute;
    bottom: 20px;
    left: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    z-index: 10;
    line-height: 1.8;
  }

  #controls .key {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid var(--text-dim);
    border-radius: 3px;
    margin: 0 4px;
    color: var(--text);
    font-size: 10px;
  }

  /* ==================== 右下角署名 ==================== */
  #sig {
    position: absolute;
    bottom: 20px;
    right: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    z-index: 10;
  }

  #sig .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    box-shadow: 0 0 8px var(--accent);
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ==================== LEVEL UP 横幅 ==================== */
  .level-banner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 15;
    pointer-events: none;
    animation: levelPop 1.6s ease-out forwards;
  }

  .level-banner.hidden {
    display: none;
  }

  .level-banner-top {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 18px;
    letter-spacing: 0.5em;
    color: var(--accent-warm);
    text-shadow: 0 0 20px var(--accent-warm);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .level-banner-name {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 72px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--text);
    text-shadow:
      0 0 30px var(--accent-warm),
      0 0 60px var(--accent-warm),
      3px 3px 0 var(--accent);
    text-transform: uppercase;
  }

  @keyframes levelPop {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.3);
      filter: blur(20px);
    }
    15% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.15);
      filter: blur(0);
    }
    25% {
      transform: translate(-50%, -50%) scale(1);
    }
    75% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.3);
      filter: blur(8px);
    }
  }

  /* ==================== 模式选择按钮 ==================== */
  .mode-select {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 780px;
  }

  .mode-btn {
    background: rgba(0, 240, 255, 0.03);
    border: 1px solid rgba(0, 240, 255, 0.3);
    padding: 20px 22px;
    width: 220px;
    cursor: pointer;
    color: var(--text);
    transition: all 0.2s ease;
    font-family: inherit;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .mode-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.2), transparent);
    transition: left 0.5s ease;
  }

  .mode-btn:hover {
    border-color: var(--accent);
    background: rgba(0, 240, 255, 0.08);
    box-shadow:
      0 0 30px rgba(0, 240, 255, 0.4),
      inset 0 0 20px rgba(0, 240, 255, 0.1);
    transform: translateY(-2px);
  }

  .mode-btn:hover::before {
    left: 100%;
  }

  .mode-btn.selected {
    border-color: var(--accent);
    background: rgba(0, 240, 255, 0.1);
    box-shadow:
      0 0 40px rgba(0, 240, 255, 0.5),
      inset 0 0 30px rgba(0, 240, 255, 0.15);
  }

  .mode-btn.selected .mode-btn-name {
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent);
  }

  .mode-btn-name {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.25em;
    margin-bottom: 8px;
    color: var(--text);
    transition: all 0.2s ease;
  }

  .mode-btn-desc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }

  .mode-btn-best {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent-purple);
    letter-spacing: 0.15em;
  }

  .start-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .key-inline {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid var(--text-dim);
    border-radius: 3px;
    color: var(--text);
    font-size: 10px;
    margin: 0 4px;
  }

  /* HUD 里的模式标识 */
  .hud-mode {
    position: absolute;
    top: 24px;
    right: 24px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent);
    padding: 6px 12px;
    border: 1px solid rgba(0, 240, 255, 0.3);
    background: rgba(0, 240, 255, 0.05);
    z-index: 10;
    pointer-events: none;
  }

  /* 生命图标 HUD */
  .lives-hud {
    position: absolute;
    top: 68px;
    right: 24px;
    display: flex;
    gap: 6px;
    z-index: 10;
    pointer-events: none;
  }

  .lives-hud.hidden {
    display: none;
  }

  .life-heart {
    width: 16px;
    height: 16px;
    background: var(--accent-warm);
    clip-path: polygon(50% 0, 100% 35%, 100% 70%, 50% 100%, 0 70%, 0 35%);
    box-shadow: 0 0 10px rgba(255, 77, 109, 0.7);
    transition: all 0.4s ease;
  }

  .life-heart.lost {
    background: rgba(122, 139, 168, 0.2);
    box-shadow: none;
    transform: scale(0.85);
  }

  .life-heart.losing {
    animation: heartBreak 0.5s ease-out forwards;
  }

  @keyframes heartBreak {
    0% { transform: scale(1); background: var(--accent-warm); box-shadow: 0 0 10px var(--accent-warm); }
    30% { transform: scale(1.8); background: #fff; box-shadow: 0 0 30px #fff; }
    60% { transform: scale(0.6); opacity: 0.4; }
    100% { transform: scale(0.85); background: rgba(122, 139, 168, 0.2); box-shadow: none; opacity: 1; }
  }

  /* 成就弹幕 */
  .achievement {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 36px;
    background: linear-gradient(135deg, rgba(255, 200, 60, 0.1), rgba(255, 150, 30, 0.15));
    border: 1px solid rgba(255, 200, 60, 0.6);
    text-align: center;
    z-index: 15;
    pointer-events: none;
    box-shadow:
      0 0 40px rgba(255, 180, 60, 0.4),
      inset 0 0 20px rgba(255, 200, 60, 0.1);
    animation: achievementIn 3.5s ease-out forwards;
  }

  .achievement.hidden {
    display: none;
  }

  .achievement-top {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.5em;
    color: #ffcc44;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .achievement-name {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: #ffe87a;
    text-shadow: 0 0 20px rgba(255, 200, 60, 0.8);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .achievement-desc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(255, 230, 180, 0.8);
    letter-spacing: 0.15em;
  }

  @keyframes achievementIn {
    0% { opacity: 0; transform: translate(-50%, -20px) scale(0.9); filter: blur(10px); }
    10% { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0); }
    80% { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0); }
    100% { opacity: 0; transform: translate(-50%, -10px) scale(1); filter: blur(4px); }
  }

  /* 危险红边 —— 1 命状态下脉冲 */
  .danger-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 8;
    box-shadow: inset 0 0 80px rgba(255, 50, 80, 0);
    transition: box-shadow 0.3s ease;
  }

  .danger-vignette.active {
    animation: dangerPulse 1.2s ease-in-out infinite;
  }

  @keyframes dangerPulse {
    0%, 100% { box-shadow: inset 0 0 80px rgba(255, 50, 80, 0.3); }
    50% { box-shadow: inset 0 0 120px rgba(255, 50, 80, 0.6); }
  }

  /* 结束界面的紧凑模式切换 */
  .mode-switch {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .mode-switch-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.4em;
    text-transform: uppercase;
  }

  .mode-switch-btns {
    display: flex;
    gap: 10px;
  }

  .mode-chip {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    padding: 8px 20px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid rgba(122, 139, 168, 0.4);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Chakra Petch', sans-serif;
  }

  .mode-chip:hover {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(0, 240, 255, 0.08);
  }

  .mode-chip.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(0, 240, 255, 0.1);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    text-shadow: 0 0 10px var(--accent);
  }

</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="720"></canvas>

  <!-- 分数 HUD -->
  <div id="hud">
    <div class="hud-item">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="scoreDisplay">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">Best</div>
      <div class="hud-value best" id="bestDisplay">0</div>
    </div>
  </div>

  <!-- 左下角操作提示 -->
  <div id="controls">
    <div><span class="key">SPACE</span> / <span class="key">↑</span> 推进</div>
    <div><span class="key">R</span> 重来 &nbsp;&nbsp; <span class="key">M</span> 静音</div>
  </div>

  <!-- 右上角模式标识 -->
  <div class="hud-mode" id="hudMode">CLASSIC</div>

  <!-- 生命图标 (仅 SURVIVAL 模式) -->
  <div class="lives-hud hidden" id="livesHud">
    <div class="life-heart" data-idx="0"></div>
    <div class="life-heart" data-idx="1"></div>
    <div class="life-heart" data-idx="2"></div>
  </div>

  <!-- 成就弹幕 -->
  <div id="achievementBanner" class="achievement hidden">
    <div class="achievement-top">ACHIEVEMENT UNLOCKED</div>
    <div class="achievement-name" id="achievementName">WOUNDED WARRIOR</div>
    <div class="achievement-desc" id="achievementDesc">Survived 20 points at 1 life</div>
  </div>

  <!-- 危险红边 (1 命时闪烁) -->
  <div id="dangerVignette" class="danger-vignette"></div>

  <div id="sig"><span class="dot"></span>SKY HOPPER · v1.0</div>

  <!-- 开始界面 -->
  <div class="overlay" id="startScreen">
    <h1 class="title">SKY HOPPER</h1>
    <div class="subtitle">Deep Space Transit</div>
    <div class="mode-select">
      <button class="mode-btn" data-mode="classic">
        <div class="mode-btn-name">CLASSIC</div>
        <div class="mode-btn-desc">Dodge between asteroids · avoid top & bottom</div>
        <div class="mode-btn-best">Best · <span id="classicBestBtn">0</span></div>
      </button>
      <button class="mode-btn" data-mode="freefly">
        <div class="mode-btn-name">FREEFLY</div>
        <div class="mode-btn-desc">Read the layout · soft walls · harder</div>
        <div class="mode-btn-best">Best · <span id="freeflyBestBtn">0</span></div>
      </button>
      <button class="mode-btn" data-mode="survival">
        <div class="mode-btn-name">SURVIVAL</div>
        <div class="mode-btn-desc">3 lives · take damage · fly wounded</div>
        <div class="mode-btn-best">Best · <span id="survivalBestBtn">0</span></div>
      </button>
    </div>
    <div class="start-hint">Click a mode &nbsp;·&nbsp; <span class="key-inline">SPACE</span> to launch</div>
  </div>

  <!-- 结束界面 -->
  <div class="overlay hidden" id="gameOverScreen">
    <div class="new-record hidden" id="newRecord">★ NEW RECORD ★</div>
    <div class="subtitle">Mission Terminated</div>
    <div class="game-over-score" id="finalScore">0</div>
    <div class="game-over-best">Best · <span class="val" id="finalBest">0</span></div>
    <div class="prompt">PRESS SPACE TO RETRY</div>
    <div class="mode-switch">
      <div class="mode-switch-label">OR SWITCH MODE</div>
      <div class="mode-switch-btns">
        <button class="mode-chip" data-mode="classic">CLASSIC</button>
        <button class="mode-chip" data-mode="freefly">FREEFLY</button>
        <button class="mode-chip" data-mode="survival">SURVIVAL</button>
      </div>
    </div>
  </div>

  <!-- 升级横幅 -->
  <div id="levelUpBanner" class="level-banner hidden">
    <div class="level-banner-top">LEVEL UP</div>
    <div class="level-banner-name" id="levelBannerName">ACCELERATE</div>
  </div>
</div>

<script>
/* ==================================================================
   SKY HOPPER — 深空穿越
   用 Canvas 2D 写的 Flappy Bird 变体,太空主题
   整个游戏就这一个文件,方便改、方便发布
   ================================================================== */

(() => {
  'use strict';

  // ===== 画布和配置 =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // 游戏常量 —— 调整这些数字可以改游戏手感
  const GRAVITY = 0.45;           // 重力 (越大掉得越快)
  const THRUST = -7.8;            // 推进速度 (负值=向上)
  const MAX_FALL = 11;            // 最大下落速度
  const PIPE_GAP = 180;           // 小行星之间的缝隙
  const PIPE_INTERVAL = 1500;     // 新障碍生成间隔 (毫秒)
  const BASE_PIPE_SPEED = 2.8;    // 障碍物初始移动速度
  const BASE_ASTEROID_SIZE = 50;  // 小行星初始半径
  const SHIP_X = 120;             // 飞船固定 X 坐标

  // ===== 难度曲线 =====
  // 每 10 分加一档,最多 10 档(100 分封顶)
  // 在 30/60/90 分时触发全屏 LEVEL UP 动画
  const LEVEL_NAMES = ['CRUISE', 'ACCELERATE', 'DANGER', 'CHAOS', 'VOID'];
  function getDifficulty() {
    const tier = Math.min(Math.floor(score / 10), 10);
    return {
      tier: tier,
      speedMult: 1 + tier * 0.08,   // 最多 +80% 速度
      sizeBonus: tier * 1.6,         // 半径最多 +16 像素
    };
  }

  // ===== 游戏状态 =====
  const STATE = { READY: 0, PLAYING: 1, OVER: 2 };
  let state = STATE.READY;

  // ===== 模式 =====
  const MODE = { CLASSIC: 'classic', FREEFLY: 'freefly', SURVIVAL: 'survival' };
  let currentMode = MODE.CLASSIC;

  // ===== SURVIVAL 模式状态 =====
  const MAX_LIVES = 3;
  let lives = MAX_LIVES;
  let invincibleUntil = 0;          // 受伤后短暂无敌,时间戳
  let scoreAtOneLife = null;        // 进入 1 命状态时的分数,用于成就触发

  // ===== 飞船 =====
  const ship = {
    x: SHIP_X, y: H / 2,
    vy: 0,
    rotation: 0,
    radius: 14,
    thrustTimer: 0,   // 推进动画计时
  };

  // ===== 世界对象 =====
  let obstacles = [];          // 小行星对
  let particles = [];          // 粒子效果
  let stars = [];              // 背景星
  let score = 0;
  // 三个模式各自记录最高分
  const bestScores = {
    classic: +(localStorage.getItem('skyhopper_best_classic') || localStorage.getItem('skyhopper_best') || 0),
    freefly: +(localStorage.getItem('skyhopper_best_freefly') || 0),
    survival: +(localStorage.getItem('skyhopper_best_survival') || 0),
  };
  let lastPipeTime = 0;
  let shakeAmount = 0;         // 屏幕抖动强度
  let flashAmount = 0;         // 屏幕闪烁
  let isMuted = false;
  let startTime = 0;
  let lastLevelShown = 0;      // 已经展示过 LEVEL UP 的分数档位

  // ===== HUD 元素 =====
  const scoreDisplay = document.getElementById('scoreDisplay');
  const bestDisplay = document.getElementById('bestDisplay');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const newRecord = document.getElementById('newRecord');
  const levelUpBanner = document.getElementById('levelUpBanner');
  const levelBannerName = document.getElementById('levelBannerName');
  const hudMode = document.getElementById('hudMode');
  const modeBtns = document.querySelectorAll('.mode-btn');
  const modeChips = document.querySelectorAll('.mode-chip');
  const classicBestBtn = document.getElementById('classicBestBtn');
  const freeflyBestBtn = document.getElementById('freeflyBestBtn');
  const survivalBestBtn = document.getElementById('survivalBestBtn');
  const livesHud = document.getElementById('livesHud');
  const lifeHearts = document.querySelectorAll('.life-heart');
  const dangerVignette = document.getElementById('dangerVignette');
  const achievementBanner = document.getElementById('achievementBanner');
  const achievementName = document.getElementById('achievementName');
  const achievementDesc = document.getElementById('achievementDesc');

  // 初始化模式选择 UI
  function refreshModeUI() {
    modeBtns.forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.mode === currentMode);
    });
    modeChips.forEach(chip => {
      chip.classList.toggle('active', chip.dataset.mode === currentMode);
    });
    hudMode.textContent = currentMode.toUpperCase();
    bestDisplay.textContent = bestScores[currentMode];
    classicBestBtn.textContent = bestScores.classic;
    freeflyBestBtn.textContent = bestScores.freefly;
    survivalBestBtn.textContent = bestScores.survival;
    if (finalBest) finalBest.textContent = bestScores[currentMode];
    // SURVIVAL 模式才显示生命 HUD
    if (currentMode === MODE.SURVIVAL && state === STATE.PLAYING) {
      livesHud.classList.remove('hidden');
    } else {
      livesHud.classList.add('hidden');
    }
    refreshLivesDisplay();
  }

  // 刷新生命图标
  function refreshLivesDisplay() {
    lifeHearts.forEach((h, i) => {
      h.classList.remove('losing');
      h.classList.toggle('lost', i >= lives);
    });
    // 危险红边:只在 1 命时激活
    dangerVignette.classList.toggle('active',
      currentMode === MODE.SURVIVAL && state === STATE.PLAYING && lives === 1);
  }

  // 开始界面的大按钮
  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (state !== STATE.READY) return;
      currentMode = btn.dataset.mode;
      refreshModeUI();
    });
  });

  // 结束界面的小 chip —— 点了切换模式,但保持结束画面,等玩家按空格重开
  modeChips.forEach(chip => {
    chip.addEventListener('click', () => {
      if (state !== STATE.OVER) return;
      currentMode = chip.dataset.mode;
      refreshModeUI();
    });
  });

  refreshModeUI();

  // ==================================================================
  // 音效 —— 用 Web Audio 程序生成,不需要下载任何文件
  // ==================================================================
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playTone(freq, duration, type = 'sine', volume = 0.15) {
    if (isMuted) return;
    try {
      const ac = getAudio();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ac.currentTime);
      gain.gain.setValueAtTime(volume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + duration);
    } catch(e) {}
  }

  function soundThrust() { playTone(520, 0.08, 'square', 0.08); }
  function soundScore()  { playTone(880, 0.1, 'triangle', 0.12); setTimeout(() => playTone(1320, 0.1, 'triangle', 0.1), 50); }
  function soundCrash()  {
    if (isMuted) return;
    try {
      const ac = getAudio();
      // 白噪声爆炸
      const bufferSize = ac.sampleRate * 0.4;
      const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
      }
      const src = ac.createBufferSource();
      src.buffer = buffer;
      const gain = ac.createGain();
      gain.gain.setValueAtTime(0.3, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
      src.connect(gain);
      gain.connect(ac.destination);
      src.start();
    } catch(e) {}
  }

  // ==================================================================
  // 初始化星空背景 —— 三层视差
  // ==================================================================
  function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: Math.random() * 3,        // 0=远 1=中 2=近
        size: Math.random() * 1.5 + 0.3,
        twinkle: Math.random() * Math.PI * 2,
      });
    }
  }

  // ==================================================================
  // 重置游戏
  // ==================================================================
  // ==================================================================
  // FREEFLY 布局生成
  // ==================================================================
  // 5 种布局类型,每种有独特的挑战感
  const FREEFLY_LAYOUTS = ['SINGLE', 'DUO_H', 'TRIO', 'DIAGONAL', 'CLUSTER'];

  function pickFreeflyLayout() {
    // 加权随机:一开始出简单布局多一些,后期混合
    const t = Math.min(score / 50, 1);  // 0-1 的进度
    // 分数越高,CLUSTER 和 DIAGONAL 越多
    const weights = {
      SINGLE:   3 - t * 1.5,    // 初期 3 → 后期 1.5
      DUO_H:    2.5,             // 稳定
      TRIO:     2 + t,           // 初期 2 → 后期 3
      DIAGONAL: 1.5 + t * 1.5,   // 初期 1.5 → 后期 3
      CLUSTER:  0.5 + t * 2,     // 初期 0.5 → 后期 2.5
    };
    let total = 0;
    for (const k in weights) total += weights[k];
    let r = Math.random() * total;
    for (const k in weights) {
      r -= weights[k];
      if (r <= 0) return k;
    }
    return 'TRIO';
  }

  // 生成一个陨石对象
  function mkAst(ox, oy, sizeMul = 1, canFloat = true) {
    const willFloat = canFloat && Math.random() < 0.3;   // 30% 的陨石会浮动
    return {
      ox: ox,
      oy: oy,
      baseOy: oy,                              // 记住原始位置,用于浮动
      sizeMul: sizeMul,
      floatAmp: willFloat ? 20 + Math.random() * 30 : 0,
      floatSpeed: 0.8 + Math.random() * 1.2,
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.025,
    };
  }

  // 根据布局类型返回陨石数组
  function buildFreeflyLayout(type, diffBonus) {
    const asts = [];
    // 所有 oy 都是屏幕绝对 Y 坐标,ox 相对 obstacle.x 偏移
    switch (type) {
      case 'SINGLE': {
        // 单陨石 —— 随机位置一颗大陨石,从上或下躲
        const y = 120 + Math.random() * (H - 240);
        asts.push(mkAst(30, y, 1.15));
        break;
      }
      case 'DUO_H': {
        // 双陨石水平排列,中间有一个缝
        const gapCenter = H * (0.25 + Math.random() * 0.5);
        const gapSize = 180;
        asts.push(mkAst(30, gapCenter - gapSize / 2 - 45, 1));
        asts.push(mkAst(30, gapCenter + gapSize / 2 + 45, 1));
        break;
      }
      case 'TRIO': {
        // 三陨石,位置彻底随机
        // 把屏幕分成三段,每段里随机放一颗
        const s1 = Math.random() * (H * 0.3) + 60;
        const s2 = H * 0.3 + Math.random() * (H * 0.4) + 40;
        const s3 = H * 0.7 + Math.random() * (H * 0.25) + 30;
        // 随机让每颗大小略不同
        asts.push(mkAst(30, s1, 0.85 + Math.random() * 0.3));
        asts.push(mkAst(30, s2, 0.85 + Math.random() * 0.3));
        asts.push(mkAst(30, s3, 0.85 + Math.random() * 0.3));
        break;
      }
      case 'DIAGONAL': {
        // 斜排:两颗陨石形成斜线,前后有 x 偏移
        const flip = Math.random() < 0.5;
        // 用屏幕上下区域放两颗,留中间大片
        const y1 = 100 + Math.random() * 150;                      // 上半
        const y2 = H - 100 - Math.random() * 150;                  // 下半
        asts.push(mkAst(flip ? 0 : 60, y1, 1));
        asts.push(mkAst(flip ? 60 : 0, y2, 1));
        break;
      }
      case 'CLUSTER': {
        // 陨石簇:3-4 颗小陨石挤在一个区域,留不规则缝
        const clusterY = 180 + Math.random() * (H - 360);
        const count = 3 + Math.floor(Math.random() * 2);   // 3 或 4
        for (let i = 0; i < count; i++) {
          const offX = (Math.random() - 0.5) * 70;
          const offY = (Math.random() - 0.5) * 160;
          asts.push(mkAst(30 + offX, clusterY + offY, 0.65 + Math.random() * 0.2, false));
        }
        break;
      }
    }
    return asts;
  }

  function reset() {
    ship.x = SHIP_X;
    ship.y = H / 2;
    ship.vy = 0;
    ship.rotation = 0;
    ship.thrustTimer = 0;
    obstacles = [];
    particles = [];
    score = 0;
    lastPipeTime = performance.now();
    shakeAmount = 0;
    flashAmount = 0;
    lastLevelShown = 0;
    levelUpBanner.classList.add('hidden');
    scoreDisplay.textContent = '0';
    // SURVIVAL 模式重置
    lives = MAX_LIVES;
    invincibleUntil = 0;
    scoreAtOneLife = null;
    achievementBanner.classList.add('hidden');
    dangerVignette.classList.remove('active');
    refreshLivesDisplay();
  }

  // SURVIVAL 模式受伤处理 —— 返回 true 表示死亡
  function takeDamage(now) {
    if (now < invincibleUntil) return false;   // 无敌期内免伤
    lives--;
    // 心碎动画
    const heart = lifeHearts[lives];
    if (heart) {
      heart.classList.add('losing');
      setTimeout(() => heart.classList.remove('losing'), 500);
    }
    // 1 秒无敌
    invincibleUntil = now + 1500;
    // 受伤特效:轻抖 + 红闪
    shakeAmount = 12;
    flashAmount = 0.7;
    // 受伤粒子
    for (let i = 0; i < 20; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      particles.push({
        x: ship.x, y: ship.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 30 + Math.random() * 15,
        maxLife: 40,
        color: ['#ff4d6d', '#ffb700'][Math.floor(Math.random() * 2)],
        size: 2 + Math.random() * 2,
        type: 'spark',
      });
    }
    // 音效
    if (!isMuted) {
      playTone(200, 0.2, 'sawtooth', 0.2);
      setTimeout(() => playTone(140, 0.15, 'sawtooth', 0.15), 80);
    }
    refreshLivesDisplay();
    // 进入 1 命状态时记录分数
    if (lives === 1 && scoreAtOneLife === null) {
      scoreAtOneLife = score;
    }
    return lives <= 0;
  }

  // ==================================================================
  // 游戏主循环 —— 物理 & 碰撞
  // ==================================================================
  function update(dt, now) {
    // 星空永远滚动,不论游戏状态
    stars.forEach(s => {
      s.x -= (s.z * 0.3 + 0.1) * (state === STATE.PLAYING ? 1 : 0.3);
      if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
      s.twinkle += 0.05;
    });

    // 非游戏状态:飞船轻微浮动
    if (state !== STATE.PLAYING) {
      ship.y = H / 2 + Math.sin(now * 0.002) * 8;
      ship.rotation = Math.sin(now * 0.002) * 0.1;
      // 闲置也发出引擎粒子
      if (Math.random() < 0.3) spawnEngineParticle();
      updateParticles();
      return;
    }

    // ===== 飞船物理 =====
    ship.vy += GRAVITY;
    if (ship.vy > MAX_FALL) ship.vy = MAX_FALL;
    ship.y += ship.vy;

    // SURVIVAL 模式战损抖动:掉命越多抖得越厉害
    if (currentMode === MODE.SURVIVAL && lives < MAX_LIVES) {
      const damageLevel = MAX_LIVES - lives;   // 1 或 2
      const wobbleAmount = damageLevel * 0.6;   // 抖动幅度
      ship.y += Math.sin(now * 0.03) * wobbleAmount;
      ship.y += (Math.random() - 0.5) * damageLevel * 0.4;  // 随机颤抖
    }

    // 倾斜 —— 看起来更有动感
    ship.rotation = Math.max(-0.4, Math.min(0.9, ship.vy * 0.05));

    // ===== 生成新的小行星对 =====
    // FREEFLY 模式生成间隔略短,让布局切换更频繁
    const spawnInterval = currentMode === MODE.FREEFLY ? PIPE_INTERVAL * 0.85 : PIPE_INTERVAL;
    if (now - lastPipeTime > spawnInterval) {
      lastPipeTime = now;
      const diff = getDifficulty();

      if (currentMode === MODE.CLASSIC || currentMode === MODE.SURVIVAL) {
        // 经典/生存模式:一个缝,上下两个小行星
        const minY = 90;
        const maxY = H - 90 - PIPE_GAP;
        const gapY = Math.random() * (maxY - minY) + minY;
        obstacles.push({
          mode: 'classic',
          x: W + 40,
          gapY: gapY,
          gapH: PIPE_GAP,
          size: BASE_ASTEROID_SIZE + diff.sizeBonus,
          passed: false,
          rotTop: Math.random() * Math.PI * 2,
          rotBot: Math.random() * Math.PI * 2,
          rotSpeedTop: (Math.random() - 0.5) * 0.02,
          rotSpeedBot: (Math.random() - 0.5) * 0.02,
        });
      } else {
        // ========================================================
        // FREEFLY 模式:5 种随机布局
        // 每个 obstacle 是一组障碍物,带 asteroids 数组
        // 每颗 asteroid = {ox, oy, size, floatAmp, floatSpeed, rot, rotSpeed}
        //   ox/oy 是相对于 obstacle 中心的偏移
        // ========================================================
        const layout = pickFreeflyLayout();
        const diffBonus = diff.sizeBonus;
        const asteroids = buildFreeflyLayout(layout, diffBonus);
        obstacles.push({
          mode: 'freefly',
          layout: layout,
          x: W + 40,                                   // 障碍组的前沿 x 位置
          asteroids: asteroids,
          size: BASE_ASTEROID_SIZE + diffBonus,        // 基础大小 (用于碰撞/计分范围)
          passed: false,
          phase: Math.random() * Math.PI * 2,          // 浮动相位初始值
        });
      }
    }

    // ===== 小行星移动 + 计分 =====
    // FREEFLY 模式略快
    const modeSpeedMult = currentMode === MODE.FREEFLY ? 1.12 : 1;
    const currentSpeed = BASE_PIPE_SPEED * getDifficulty().speedMult * modeSpeedMult;
    obstacles.forEach(o => {
      o.x -= currentSpeed;
      if (o.mode === 'classic') {
        o.rotTop += o.rotSpeedTop;
        o.rotBot += o.rotSpeedBot;
      } else {
        // FREEFLY:更新每颗陨石的旋转和浮动
        for (const a of o.asteroids) {
          a.rot += a.rotSpeed;
          if (a.floatAmp > 0) {
            // 正弦浮动:用时间驱动
            a.oy = a.baseOy + Math.sin(now * 0.001 * a.floatSpeed + a.phase) * a.floatAmp;
          }
        }
      }
      if (!o.passed && o.x + 40 < ship.x) {
        o.passed = true;
        score++;
        scoreDisplay.textContent = score;
        soundScore();
        // 得分闪光
        flashAmount = 0.3;
        // 得分粒子
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: ship.x, y: ship.y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 30, maxLife: 30,
            color: '#00f0ff', size: 2,
            type: 'spark',
          });
        }
        // 检查是否到达升级里程碑 (每 30 分)
        checkLevelUp();
        // SURVIVAL 模式:检查"战损 20" 成就
        if (currentMode === MODE.SURVIVAL && lives === 1 && scoreAtOneLife !== null) {
          if (score - scoreAtOneLife >= 20) {
            showAchievement('WOUNDED WARRIOR', 'Survived 20 points at 1 life');
            // 重新计数,让玩家可以再触发(如果继续活着)
            scoreAtOneLife = score;
          }
        }
      }
    });
    obstacles = obstacles.filter(o => o.x > -80);

    // ===== 引擎尾迹粒子 =====
    if (Math.random() < 0.6) spawnEngineParticle();

    // ===== 碰撞检测 =====
    // 上下边界
    if (currentMode === MODE.CLASSIC || currentMode === MODE.SURVIVAL) {
      // 经典/生存模式:撞到上下边界直接死 (SURVIVAL 边界也是一击必杀)
      if (ship.y - ship.radius < 0 || ship.y + ship.radius > H) {
        gameOver();
        return;
      }
    } else {
      // FREEFLY 模式:软反弹 —— 碰到边界反弹回来,不死
      if (ship.y - ship.radius < 0) {
        ship.y = ship.radius;
        if (ship.vy < 0) ship.vy = -ship.vy * 0.5;  // 向上撞,反弹向下
      } else if (ship.y + ship.radius > H) {
        ship.y = H - ship.radius;
        if (ship.vy > 0) ship.vy = -ship.vy * 0.5;  // 向下撞,反弹向上
      }
    }

    // 小行星碰撞
    for (const o of obstacles) {
      if (o.mode === 'classic') {
        // 经典/生存模式:矩形碰撞检测
        if (ship.x + ship.radius > o.x && ship.x - ship.radius < o.x + 60) {
          if (ship.y - ship.radius < o.gapY || ship.y + ship.radius > o.gapY + o.gapH) {
            if (currentMode === MODE.SURVIVAL) {
              if (takeDamage(now)) {
                gameOver();
                return;
              }
              // 让飞船跳出碰撞区域,避免连续触发
              ship.y = (o.gapY + o.gapY + o.gapH) / 2;
              ship.vy = 0;
              break;   // 本帧只扣一条命
            } else {
              gameOver();
              return;
            }
          }
        }
      } else {
        // FREEFLY 模式:循环检测每颗陨石
        for (const a of o.asteroids) {
          const astX = o.x + a.ox;
          const astY = a.oy;
          const astR = (o.size * a.sizeMul) * 0.78;   // 碰撞半径,比视觉略小
          // 粗筛 x 范围,省计算
          if (Math.abs(ship.x - astX) > astR + ship.radius + 5) continue;
          const dx = ship.x - astX;
          const dy = ship.y - astY;
          if (dx * dx + dy * dy < (ship.radius + astR) * (ship.radius + astR)) {
            gameOver();
            return;
          }
        }
      }
    }

    updateParticles();

    // 衰减抖动和闪光
    shakeAmount *= 0.88;
    flashAmount *= 0.92;
  }

  function spawnEngineParticle() {
    // 从飞船尾部喷出
    const trailX = ship.x - 14 - Math.cos(ship.rotation) * 6;
    const trailY = ship.y + Math.sin(ship.rotation) * 6;
    particles.push({
      x: trailX + (Math.random() - 0.5) * 4,
      y: trailY + (Math.random() - 0.5) * 4,
      vx: -2 - Math.random() * 1.5,
      vy: (Math.random() - 0.5) * 0.8,
      life: 20 + Math.random() * 15,
      maxLife: 35,
      color: Math.random() < 0.5 ? '#00f0ff' : '#b388ff',
      size: 2 + Math.random() * 2,
      type: 'trail',
    });
  }

  function updateParticles() {
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.type === 'spark') {
        p.vy += 0.15;
        p.vx *= 0.97;
      }
      p.life--;
    });
    particles = particles.filter(p => p.life > 0);
  }

  // ===== 成就系统 =====
  function showAchievement(name, desc) {
    achievementName.textContent = name;
    achievementDesc.textContent = desc;
    achievementBanner.classList.add('hidden');
    // 触发重绘以重启动画
    void achievementBanner.offsetWidth;
    achievementBanner.classList.remove('hidden');
    setTimeout(() => {
      achievementBanner.classList.add('hidden');
    }, 3500);
    // 成就音效:金色上扬
    if (!isMuted) {
      playTone(660, 0.1, 'triangle', 0.12);
      setTimeout(() => playTone(880, 0.1, 'triangle', 0.14), 100);
      setTimeout(() => playTone(1100, 0.15, 'triangle', 0.15), 200);
      setTimeout(() => playTone(1320, 0.25, 'triangle', 0.12), 320);
    }
  }

  // ===== 升级检测 =====
  // 每 30 分触发一次 LEVEL UP 动画
  function checkLevelUp() {
    const milestone = Math.floor(score / 30);
    if (milestone > lastLevelShown && milestone > 0) {
      lastLevelShown = milestone;
      // 从 LEVEL_NAMES 里取名字 (0 档叫 CRUISE,所以 30 分触发 ACCELERATE)
      const name = LEVEL_NAMES[Math.min(milestone, LEVEL_NAMES.length - 1)];
      showLevelUp(name);
    }
  }

  function showLevelUp(name) {
    levelBannerName.textContent = name;
    // 重启动画:先移除,强制重绘,再加回来
    levelUpBanner.classList.add('hidden');
    // 触发重绘
    void levelUpBanner.offsetWidth;
    levelUpBanner.classList.remove('hidden');
    // 1.6 秒后自动隐藏 (匹配 CSS 动画时长)
    setTimeout(() => {
      levelUpBanner.classList.add('hidden');
    }, 1600);
    // 升级音效
    if (!isMuted) {
      playTone(440, 0.15, 'triangle', 0.15);
      setTimeout(() => playTone(660, 0.15, 'triangle', 0.15), 80);
      setTimeout(() => playTone(880, 0.25, 'triangle', 0.15), 160);
    }
    // 屏幕闪光
    flashAmount = 0.6;
  }

  function thrust() {
    if (state === STATE.READY) {
      state = STATE.PLAYING;
      startTime = performance.now();
      lastPipeTime = startTime;
      startScreen.classList.add('hidden');
      refreshModeUI();   // 显示生命 HUD(如果是 SURVIVAL)
    } else if (state === STATE.OVER) {
      // 结束后按空格重开 —— 但必须等结束画面显示出来,避免误触
      if (gameOverScreen.classList.contains('hidden')) return;
      reset();
      state = STATE.PLAYING;
      startTime = performance.now();
      lastPipeTime = startTime;
      gameOverScreen.classList.add('hidden');
      bestDisplay.textContent = bestScores[currentMode];
      refreshModeUI();   // 显示生命 HUD
      return;
    }
    if (state === STATE.PLAYING) {
      ship.vy = THRUST;
      ship.thrustTimer = 10;
      soundThrust();
      // 推进时喷出爆发粒子
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: ship.x - 12, y: ship.y,
          vx: -3 - Math.random() * 2,
          vy: (Math.random() - 0.5) * 3,
          life: 18, maxLife: 18,
          color: '#00f0ff', size: 3,
          type: 'trail',
        });
      }
    }
  }

  function gameOver() {
    state = STATE.OVER;
    shakeAmount = 20;
    flashAmount = 1;
    soundCrash();

    // 隐藏生命 HUD 和危险红边
    livesHud.classList.add('hidden');
    dangerVignette.classList.remove('active');

    // 飞船爆炸 —— 一堆粒子
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      particles.push({
        x: ship.x, y: ship.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 40 + Math.random() * 20,
        maxLife: 60,
        color: ['#ff4d6d', '#ffb700', '#00f0ff'][Math.floor(Math.random() * 3)],
        size: 2 + Math.random() * 3,
        type: 'spark',
      });
    }

    // 记录分数 (按模式分别记录)
    const isNew = score > bestScores[currentMode];
    if (isNew) {
      bestScores[currentMode] = score;
      localStorage.setItem('skyhopper_best_' + currentMode, score);
      bestDisplay.textContent = score;
    }

    // 延迟显示结束界面 (先让爆炸演一会)
    setTimeout(() => {
      finalScore.textContent = score;
      finalBest.textContent = bestScores[currentMode];
      newRecord.classList.toggle('hidden', !isNew);
      gameOverScreen.classList.remove('hidden');
    }, 700);
  }

  // ==================================================================
  // 渲染 —— 画画的部分
  // ==================================================================
  function render() {
    ctx.save();

    // 屏幕抖动
    if (shakeAmount > 0.5) {
      ctx.translate(
        (Math.random() - 0.5) * shakeAmount,
        (Math.random() - 0.5) * shakeAmount
      );
    }

    // ===== 背景渐变 =====
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#02030a');
    bg.addColorStop(0.5, '#0a0f1f');
    bg.addColorStop(1, '#0d1029');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ===== 星空 (三层视差) =====
    stars.forEach(s => {
      const tw = Math.sin(s.twinkle) * 0.3 + 0.7;
      const alpha = (s.z / 3) * 0.8 + 0.2;
      ctx.fillStyle = `rgba(${s.z > 1.5 ? '255, 230, 200' : s.z > 0.7 ? '200, 220, 255' : '150, 170, 210'}, ${alpha * tw})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * (0.5 + s.z / 4), 0, Math.PI * 2);
      ctx.fill();
      // 近的星加光晕
      if (s.z > 2) {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.15 * tw})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // ===== 远方星云效果 =====
    const nebula = ctx.createRadialGradient(W * 0.7, H * 0.3, 20, W * 0.7, H * 0.3, 200);
    nebula.addColorStop(0, 'rgba(179, 136, 255, 0.15)');
    nebula.addColorStop(1, 'rgba(179, 136, 255, 0)');
    ctx.fillStyle = nebula;
    ctx.fillRect(0, 0, W, H);

    // ===== 小行星障碍 =====
    obstacles.forEach(o => drawAsteroidPair(o));

    // ===== 粒子 (尾迹在飞船之前) =====
    particles.filter(p => p.type === 'trail').forEach(p => drawParticle(p));

    // ===== 飞船 =====
    if (state !== STATE.OVER) drawShip();

    // ===== 爆炸粒子 (在飞船之上) =====
    particles.filter(p => p.type === 'spark').forEach(p => drawParticle(p));

    // ===== 闪光覆盖 =====
    if (flashAmount > 0.01) {
      ctx.fillStyle = `rgba(0, 240, 255, ${flashAmount * 0.3})`;
      ctx.fillRect(0, 0, W, H);
    }

    // ===== 暗角 (vignette) =====
    const vignette = ctx.createRadialGradient(W/2, H/2, H/2.5, W/2, H/2, H);
    vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vignette.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();
  }

  function drawShip() {
    // SURVIVAL 模式:无敌期内闪烁(每 80ms 一次)
    const now = performance.now();
    const isInvincible = currentMode === MODE.SURVIVAL && now < invincibleUntil;
    if (isInvincible && Math.floor(now / 80) % 2 === 0) {
      return;   // 跳过这一帧不画,产生闪烁效果
    }

    // 战损等级:0 = 满血,1 = 掉一命,2 = 重伤(1 命)
    const damageLevel = (currentMode === MODE.SURVIVAL) ? (MAX_LIVES - lives) : 0;

    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.rotation);

    // 外发光 —— 受伤后发光颜色偏红
    if (damageLevel >= 2) {
      ctx.shadowColor = '#ff4d6d';
      ctx.shadowBlur = 18;
    } else if (damageLevel === 1) {
      ctx.shadowColor = '#ffb700';
      ctx.shadowBlur = 18;
    } else {
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 20;
    }

    // 引擎火焰 (推进时更大)
    // 战损时火焰颜色偏黄/红,并且不稳定
    const flameLen = ship.thrustTimer > 0 ? 18 : 10;
    if (ship.thrustTimer > 0) ship.thrustTimer--;
    // 战损时火焰长度抖动
    const flickerFlame = damageLevel > 0 ? flameLen + (Math.random() - 0.5) * damageLevel * 6 : flameLen;
    const grad = ctx.createLinearGradient(-flickerFlame, 0, -4, 0);
    grad.addColorStop(0, 'rgba(0, 240, 255, 0)');
    if (damageLevel >= 2) {
      grad.addColorStop(0.4, 'rgba(255, 80, 80, 0.5)');
      grad.addColorStop(1, 'rgba(255, 200, 100, 1)');
    } else if (damageLevel === 1) {
      grad.addColorStop(0.5, 'rgba(255, 180, 0, 0.6)');
      grad.addColorStop(1, 'rgba(255, 255, 200, 1)');
    } else {
      grad.addColorStop(0.5, 'rgba(0, 240, 255, 0.6)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 1)');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-flickerFlame, 0);
    ctx.lineTo(-4, -5);
    ctx.lineTo(-4, 5);
    ctx.closePath();
    ctx.fill();

    // 飞船机身
    ctx.shadowBlur = 15;
    // 战损时机身颜色变暗
    if (damageLevel >= 2) {
      ctx.fillStyle = '#a89a9c';        // 破损灰
      ctx.strokeStyle = '#ff4d6d';
    } else if (damageLevel === 1) {
      ctx.fillStyle = '#c8c4c0';        // 微损灰白
      ctx.strokeStyle = '#ffb700';
    } else {
      ctx.fillStyle = '#e8f1ff';
      ctx.strokeStyle = '#00f0ff';
    }
    ctx.lineWidth = 1.5;

    // 机身形状 —— 根据战损改变轮廓
    ctx.beginPath();
    if (damageLevel === 0) {
      // 完好
      ctx.moveTo(16, 0);
      ctx.lineTo(-8, -10);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-8, 10);
    } else if (damageLevel === 1) {
      // 一处缺口:左翼有个小豁口
      ctx.moveTo(16, 0);
      ctx.lineTo(-8, -10);
      ctx.lineTo(-3, -6);      // 缺口
      ctx.lineTo(-5, -4);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-8, 10);
    } else {
      // 重伤:两处缺口,更破
      ctx.moveTo(13, -1);      // 机头也破了
      ctx.lineTo(14, 1);
      ctx.lineTo(-8, -10);
      ctx.lineTo(-3, -6);      // 左翼缺口
      ctx.lineTo(-5, -4);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-8, 10);
      ctx.lineTo(-3, 6);       // 右翼缺口
      ctx.lineTo(-5, 4);
      ctx.lineTo(-4, 0);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 驾驶舱 (青色小圆) —— 重伤时变红
    ctx.shadowBlur = 8;
    ctx.fillStyle = damageLevel >= 2 ? '#ff4d6d' : (damageLevel === 1 ? '#ffb700' : '#00f0ff');
    ctx.beginPath();
    ctx.arc(6, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // 机翼线条 —— 完好时才画
    if (damageLevel === 0) {
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-2, -8);
      ctx.lineTo(10, 0);
      ctx.lineTo(-2, 8);
      ctx.stroke();
    }

    // 战损时:冒烟粒子 (在飞船机身位置随机生成)
    // 这里只画静态的"火花",真正的烟粒子通过 particle 系统生成
    if (damageLevel >= 2 && Math.random() < 0.4) {
      ctx.shadowColor = '#ffb700';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffb700';
      ctx.beginPath();
      ctx.arc(-4 + (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 10, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    // 在飞船外部(世界坐标)持续冒烟 —— 重伤时
    if (damageLevel >= 2 && state === STATE.PLAYING && Math.random() < 0.4) {
      particles.push({
        x: ship.x - 4 + (Math.random() - 0.5) * 4,
        y: ship.y + (Math.random() - 0.5) * 6,
        vx: -0.8 - Math.random() * 0.5,
        vy: -0.3 - Math.random() * 0.4,
        life: 30 + Math.random() * 20,
        maxLife: 50,
        color: Math.random() < 0.4 ? '#ff4d6d' : '#808080',
        size: 2 + Math.random() * 1.5,
        type: 'trail',
      });
    }
  }

  function drawAsteroidPair(o) {
    const size = o.size || BASE_ASTEROID_SIZE;

    if (o.mode === 'classic') {
      // 经典:上下各一个
      drawAsteroid(o.x + 30, o.gapY - 30, size, o.rotTop);
      drawAsteroid(o.x + 30, o.gapY + o.gapH + 30, size, o.rotBot);

      // 缝隙中间的能量引导线
      ctx.save();
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 8]);
      ctx.beginPath();
      ctx.moveTo(o.x + 30, o.gapY + 10);
      ctx.lineTo(o.x + 30, o.gapY + o.gapH - 10);
      ctx.stroke();
      ctx.restore();
    } else {
      // FREEFLY:循环绘制数组里每颗陨石
      for (const a of o.asteroids) {
        drawAsteroid(o.x + a.ox, a.oy, size * a.sizeMul, a.rot);
      }
    }
  }

  function drawAsteroid(x, y, size, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);

    // 外发光
    ctx.shadowColor = '#ff4d6d';
    ctx.shadowBlur = 15;

    // 小行星形状 —— 不规则多边形
    const sides = 9;
    const points = [];
    for (let i = 0; i < sides; i++) {
      const angle = (i / sides) * Math.PI * 2;
      // 用确定性噪声让每个小行星外形稳定但不一样
      const r = size + Math.sin(i * 2.3 + rotation * 5) * 6 + Math.cos(i * 3.7) * 4;
      points.push([Math.cos(angle) * r, Math.sin(angle) * r]);
    }

    // 填充渐变
    const grad = ctx.createRadialGradient(-size * 0.3, -size * 0.3, size * 0.2, 0, 0, size);
    grad.addColorStop(0, '#6b4556');
    grad.addColorStop(0.6, '#3d2838');
    grad.addColorStop(1, '#1a0f1c');
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i][0], points[i][1]);
    }
    ctx.closePath();
    ctx.fill();

    // 边缘
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255, 77, 109, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 表面陨石坑
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.arc(-size * 0.2, -size * 0.1, size * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(size * 0.3, size * 0.2, size * 0.08, 0, Math.PI * 2);
    ctx.fill();

    // 高光
    ctx.fillStyle = 'rgba(255, 200, 200, 0.15)';
    ctx.beginPath();
    ctx.arc(-size * 0.35, -size * 0.35, size * 0.15, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawParticle(p) {
    const alpha = p.life / p.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ==================================================================
  // 主循环
  // ==================================================================
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(now - lastTime, 33);
    lastTime = now;
    update(dt, now);
    render();
    requestAnimationFrame(loop);
  }

  // ==================================================================
  // 输入
  // ==================================================================
  function handleInput(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      thrust();
    } else if (e.code === 'KeyR') {
      if (state === STATE.OVER || state === STATE.PLAYING) {
        reset();
        state = STATE.READY;
        gameOverScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
        refreshModeUI();
      }
    } else if (e.code === 'KeyM') {
      isMuted = !isMuted;
    }
  }

  document.addEventListener('keydown', handleInput);
  canvas.addEventListener('mousedown', (e) => { e.preventDefault(); thrust(); });
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); thrust(); }, { passive: false });

  // ==================================================================
  // 启动
  // ==================================================================
  initStars();
  reset();
  state = STATE.READY;
  requestAnimationFrame(loop);
})();
</script>
</body>
